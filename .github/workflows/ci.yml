name: CI

# The agent consumes the published `@adaptivemcp/*` libraries from npm, so CI
# installs from the registry and needs no sibling checkout.
#
# The optional `integration-qc` job drives the public `adaptivemcp/qc` repo; it
# is gated on the `QC_E2E_ENABLED` repository variable (no token needed).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4
        with:
          path: agent

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml

      - name: Install agent
        working-directory: agent
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: agent
        run: pnpm lint

      - name: Typecheck
        working-directory: agent
        run: pnpm typecheck

      - name: Build
        working-directory: agent
        run: pnpm build

      - name: Test
        working-directory: agent
        run: pnpm test

      - name: Coverage gate
        working-directory: agent
        run: pnpm test:coverage

  integration-qc:
    # The real-server e2e drives the public QueryCleaner/QC MCP server over stdio
    # (src/mcp/qc-mcp.integration.test.ts). Opt-in via the repository variable
    # `QC_E2E_ENABLED=true` — kept off by default so a fork doesn't pay the QC
    # Python toolchain cost. The QC repo is public, so no token is needed.
    if: ${{ vars.QC_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4
        with:
          path: agent

      - name: "Checkout QC (real MCP server under test)"
        uses: actions/checkout@v4
        with:
          repository: adaptivemcp/qc
          path: qc

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install agent
        working-directory: agent
        run: pnpm install --frozen-lockfile

      - name: Set up QC (uv venv + qc entry point)
        working-directory: qc
        run: uv sync --locked

      - name: Real QC MCP server e2e
        working-directory: agent
        run: pnpm test:integration

  conformance-client:
    # The agent is an MCP *client*; this checks its wire behaviour against the official
    # harness rather than our own fixtures (docs/conformance-client.md). Blocking: both
    # graded scenarios pass, and the two failures the advisory phase produced were ours
    # (a stale harness pin and a spawnSync deadlock in the adapter), not flakes — so a
    # red run here means the client regressed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4
        with:
          path: agent

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml

      - name: Install agent
        working-directory: agent
        run: pnpm install --frozen-lockfile

      - name: Conformance (initialize)
        working-directory: agent
        run: |
          npx -y @modelcontextprotocol/conformance@0.1.16 client \
            --command "node scripts/conformance-client.mjs" \
            --scenario initialize \
            --output-dir conformance-results/initialize

      - name: Conformance (tools_call)
        working-directory: agent
        run: |
          npx -y @modelcontextprotocol/conformance@0.1.16 client \
            --command "node scripts/conformance-client.mjs --call" \
            --scenario tools_call \
            --output-dir conformance-results/tools_call

      - name: Conformance (auth metadata)
        working-directory: agent
        run: |
          npx -y @modelcontextprotocol/conformance@0.1.16 client \
            --command "node scripts/conformance-client.mjs --auth" \
            --scenario auth/metadata-default \
            --timeout 60000 \
            --output-dir conformance-results/auth-metadata-default

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-client-results
          path: agent/conformance-results
