packages:
  - "."

# pnpm 11 reads build-script approval + overrides from this file (NOT from
# `pnpm.onlyBuiltDependencies` / `pnpm.overrides` in package.json).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@adaptivemcp/approval@0.2.4'
  - '@adaptivemcp/evaluation@0.4.0'
  - '@adaptivemcp/extension@0.5.0'
  - '@adaptivemcp/graph-analysis@0.2.1'
  - '@adaptivemcp/memory@0.4.0'
  - '@adaptivemcp/middleware@0.1.2'
  - '@adaptivemcp/orchestration@0.2.4'
  - '@adaptivemcp/routing@0.4.0'
  - '@adaptivemcp/runtime@0.4.0'
  - '@adaptivemcp/spec@0.4.0'
  - '@adaptivemcp/telemetry@0.1.7'
  - '@adaptivemcp/thin-client@0.4.0'

# Security parity with the adaptive-mcp repo: force patched transitive versions
# pulled by the MCP SDK's HTTP transports. See ../adaptive-mcp/README.md.
overrides:
  hono: 4.13.9
  qs: 6.16.0
  fast-uri: 3.1.8
  ip-address: 10.7.2
  "@hono/node-server": 1.19.17
  "js-yaml@<4": 3.15.2
