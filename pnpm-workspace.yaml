packages:
  - "."

# pnpm 11 reads build-script approval + overrides from this file (NOT from
# `pnpm.onlyBuiltDependencies` / `pnpm.overrides` in package.json).
allowBuilds:
  esbuild: true

# pnpm maintains this list for `minimumReleaseAge`: it records every version it
# had to accept inside the cutoff, widening an entry to `old || new` when a
# transitive 0.x range still resolves to the old one. It re-adds what it needs,
# so pruning stale entries by hand is safe.
minimumReleaseAgeExclude:
  - '@adaptivemcp/approval@0.2.5'
  - '@adaptivemcp/evaluation@0.4.1'
  - '@adaptivemcp/extension@0.5.1'
  - '@adaptivemcp/graph-analysis@0.2.2'
  - '@adaptivemcp/memory@0.5.0'
  - '@adaptivemcp/middleware@0.1.3'
  - '@adaptivemcp/orchestration@0.2.5'
  - '@adaptivemcp/routing@0.4.1'
  - '@adaptivemcp/runtime@0.4.1'
  - '@adaptivemcp/spec@0.5.0'
  - '@adaptivemcp/telemetry@0.1.8'
  - '@adaptivemcp/thin-client@0.5.0'

# Security parity with the adaptive-mcp repo: force patched transitive versions
# pulled by the MCP SDK's HTTP transports. See ../adaptive-mcp/README.md.
overrides:
  hono: 4.13.9
  qs: 6.16.0
  fast-uri: 3.1.8
  ip-address: 10.7.2
  "@hono/node-server": 1.19.17
  "js-yaml@<4": 3.15.2
