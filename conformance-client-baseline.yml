# Client conformance baseline — known failures, in the harness's own format.
#
# An entry is `<scenario>` for a whole scenario, or `<scenario>:<check-id>` for one check.
# The harness's exit-code rules make this symmetric:
#
#   fails + listed     → 0  (expected)
#   fails + not listed → 1  (regression)
#   passes + listed    → 1  (stale entry — remove it)
#   passes + not listed → 0
#
# So an entry is a measured gap with a reason, not a suppression: when the work lands, the
# entry starts passing and CI fails until it is deleted.
#
# The two machine-to-machine scenarios that used to live here now pass via the explicit
# `client_credentials` grant (`--client-credentials`), so their entries were removed.
client:
  # --- Token exchange between applications (extension, multiple hops).
  #
  # Measured the same day: the client completes the first app's flow and never performs the
  # `token-exchange` / JWT-bearer exchange into the second app. That is a cross-application
  # delegation model this host has no caller for; inventing the flow to satisfy a scenario
  # would be building a feature without a consumer.
  - auth/cross-app-access-complete-flow
