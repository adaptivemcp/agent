# Client conformance baseline — known failures, in the harness's own format.
#
# An entry is `<scenario>` for a whole scenario, or `<scenario>:<check-id>` for one
# check. The harness exit-code rules:
#
#   fails + listed     → 0  (expected)
#   fails + not listed → 1  (regression)
#   passes + listed    → 1  (stale entry — remove it)
#   passes + not listed → 0
#
# So an entry here is a measured gap with a reason, not a suppression: when the work
# lands, the entry starts passing and CI fails until it is deleted.
client:
  # --- OAuth discovery is not implemented in the CLI path.
  #
  # Measured 2026-11-07 on conformance@0.1.16 against `scripts/conformance-client.mjs`:
  # the harness answers `POST /mcp` with 401 + `WWW-Authenticate`, and the client stops
  # there. All five expected checks are missing (prm-pathbased-requested,
  # authorization-server-metadata, client-registration, authorization-request,
  # token-request).
  #
  # That is accurate: `HttpToolset` sends static headers, and `OAuthMiddleware` exists in
  # `@adaptivemcp/thin-client` and is covered by `src/mcp/http-oauth.integration.test.ts`,
  # but the CLI has no way to configure it per server and nothing performs protected-
  # resource-metadata discovery or dynamic client registration.
  #
  # Removing this entry means: PRM discovery → AS metadata → registration → authorization
  # request → token request all happen from the CLI, and the scenario passes.
  - auth/metadata-default
